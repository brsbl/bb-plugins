    const r = document.documentElement.style;
    r.setProperty("--sf-water", pal.water); r.setProperty("--sf-label", pal.label); r.setProperty("--sf-city", pal.city);
    r.setProperty("--sf-dist", pal.dist); r.setProperty("--sf-halo", pal.halo); r.setProperty("--sf-badge", pal.badge);
    r.setProperty("--sf-route", pal.route); r.setProperty("--sf-ring", pal.ring); r.setProperty("--sf-glyph", pal.glyph);
  };
  applyPalette();

  const w = (px) => px * S; // line widths in final CSS px
  const z = (stops) => ["interpolate", ["exponential", 1.6], ["zoom"], ...stops.flatMap(([zz, v]) => [zz, w(v)])];
  const notBrunnel = ["!=", ["get", "brunnel"], "tunnel"];
  const greenPark = ["!", ["match", ["get", "class"], ["historic", "historic_district", "marine", "sustainable"], true, false]];
  const cls = (...c) => ["match", ["get", "class"], c, true, false];
  const buildStyle = () => ({
    version: 8,
    sources: { omt: { type: "vector", url: "https://tiles.openfreemap.org/planet", attribution: "© OpenStreetMap contributors, OpenFreeMap, OpenMapTiles" } },
    layers: [
      { id: "bg", type: "background", paint: { "background-color": pal.land } },
      { id: "wood", type: "fill", source: "omt", "source-layer": "landcover", filter: cls("wood", "grass", "scrub"), paint: { "fill-color": pal.wood, "fill-opacity": .9 } },
      { id: "sand", type: "fill", source: "omt", "source-layer": "landcover", filter: cls("sand"), paint: { "fill-color": pal.sand } },
      { id: "park", type: "fill", source: "omt", "source-layer": "park", filter: greenPark, paint: { "fill-color": pal.park } },
      { id: "green", type: "fill", source: "omt", "source-layer": "landuse", filter: cls("cemetery", "pitch", "playground", "golf", "park", "garden", "zoo"), paint: { "fill-color": pal.park, "fill-opacity": .8 } },
      { id: "water", type: "fill", source: "omt", "source-layer": "water", filter: notBrunnel, paint: { "fill-color": pal.water } },
      { id: "minor-case", type: "line", source: "omt", "source-layer": "transportation", filter: ["all", notBrunnel, cls("minor", "service")], layout: { "line-join": "round" }, paint: { "line-color": pal.minorCase, "line-width": z([[12, .8], [16, 4]]) } },
      { id: "major-case", type: "line", source: "omt", "source-layer": "transportation", filter: ["all", notBrunnel, cls("tertiary", "secondary", "primary")], layout: { "line-join": "round" }, paint: { "line-color": pal.majorCase, "line-width": z([[12, 1.3], [16, 6]]) } },
      { id: "minor", type: "line", source: "omt", "source-layer": "transportation", filter: ["all", notBrunnel, cls("minor", "service")], layout: { "line-join": "round", "line-cap": "round" }, paint: { "line-color": pal.minor, "line-width": z([[12, .45], [16, 3]]) } },
      { id: "park-over", type: "fill", source: "omt", "source-layer": "park", filter: greenPark, paint: { "fill-color": pal.park, "fill-opacity": .82 } },
      { id: "major", type: "line", source: "omt", "source-layer": "transportation", filter: ["all", notBrunnel, cls("tertiary", "secondary", "primary")], layout: { "line-join": "round", "line-cap": "round" }, paint: { "line-color": pal.major, "line-width": z([[12, .8], [16, 4.5]]) } },
      { id: "arterial", type: "line", source: "omt", "source-layer": "transportation", filter: ["all", notBrunnel, cls("trunk")], layout: { "line-join": "round", "line-cap": "round" }, paint: { "line-color": pal.arterial, "line-width": z([[12, 1], [16, 5]]) } },
      { id: "motorway", type: "line", source: "omt", "source-layer": "transportation", filter: ["all", notBrunnel, cls("motorway"), ["!=", ["get", "ramp"], 1]], layout: { "line-join": "round", "line-cap": "round" }, paint: { "line-color": pal.motorway, "line-width": z([[12, 1.5], [16, 6]]) } },
    ],
  });

  // ---------- Map ----------
  const mapEl = $("map"), glEl = $("gl");
  mapEl.dataset.expanded = String(state.expanded);
  // The frame can start before layout (width 0); fall back to the card width until it is measured.
  const homeZoom = () => Math.log2((360 * (mapEl.clientWidth || 460)) / (512 * HOME.lonSpan)) + Math.log2(S);
  let map = null, ready = false;
  try {
    map = new maplibregl.Map({
      container: glEl, style: buildStyle(), center: HOME.center, zoom: homeZoom(),
      pixelRatio: (window.devicePixelRatio || 1) / S, attributionControl: false,
      scrollZoom: false, dragRotate: false, pitchWithRotate: false, touchPitch: false, boxZoom: false, keyboard: false,
      fadeDuration: 0, renderWorldCopies: false, maxPitch: 0,
    });
    map.touchZoomRotate.disableRotation();
    map.on("load", () => { ready = true; place(); });
    map.on("move", place); map.on("resize", place);
  } catch (error) { console.error(error); }
  // Re-home once the container has its real width, if the map started unmeasured.
  if (map && !mapEl.clientWidth) {
    const ro = new ResizeObserver(() => {
      if (!mapEl.clientWidth) return;
      ro.disconnect(); map.resize(); map.jumpTo({ center: HOME.center, zoom: homeZoom() });
    });
    ro.observe(mapEl);
  }
  window.answer?.onTheme?.(() => { applyPalette(); map?.setStyle(buildStyle()); });

  const project = (ll) => {
    if (!map) return { x: 0, y: 0 };
    const p = map.project(ll); return { x: p.x / S, y: p.y / S };
  };

  // Labels + shields
  const labelEls = LABELS.map((l) => { const el = document.createElement("div"); el.className = "sf-lbl " + l.cls; el.innerHTML = l.text; $("labels").append(el); return el; });
  const shieldSvg = (s) => s.kind === "us"
    ? `<svg viewBox="0 0 18 18"><path d="M2.2 2.4h13.6c.2 1.2-.2 2 .4 3.2.8 1.6.4 4.6-1.6 6.8C12.8 14.3 10.6 15 9 16c-1.6-1-3.8-1.7-5.6-3.6-2-2.2-2.4-5.2-1.6-6.8.6-1.2.2-2 .4-3.2z" fill="#fff" stroke="#444" stroke-width="1"/><text x="9" y="10.6" text-anchor="middle" font-size="${s.n.length > 2 ? 6.2 : 7.4}" font-weight="700" font-family="Inter Variable, sans-serif" fill="#222">${s.n}</text></svg>`
    : `<svg viewBox="0 0 18 18"><path d="M2.3 3.2c2.2.5 4.4-.3 6.7-1.3 2.3 1 4.5 1.8 6.7 1.3.6 2.2.6 4.6 0 6.7C14.6 13 12 14.8 9 16.2 6 14.8 3.4 13 2.3 9.9c-.6-2.1-.6-4.5 0-6.7z" fill="#2c4bb3" stroke="#fff" stroke-width="1"/><path d="M2.6 3.3c2.2.5 4.3-.3 6.4-1.2 2.1.9 4.2 1.7 6.4 1.2.2.9.3 1.7.3 2.5H2.3c0-.8.1-1.6.3-2.5z" fill="#d9342b"/><text x="9" y="12.3" text-anchor="middle" font-size="${s.n.length > 2 ? 5.6 : 6.4}" font-weight="700" font-family="Inter Variable, sans-serif" fill="#fff">${s.n}</text></svg>`;
  const shieldEls = SHIELDS.map((s) => { const el = document.createElement("div"); el.className = "sf-shield"; el.innerHTML = shieldSvg(s); $("labels").append(el); return el; });

  // Markers
  const markerEls = MARKERS.map((m) => {
    const el = document.createElement("button");
    el.className = "sf-mk out" + (m.small ? " small" : ""); el.dataset.id = m.id;
    el.setAttribute("aria-label", m.label);
    el.innerHTML = `<span class="b">${GLYPHS[m.glyph || PLACES[m.place].glyph]}</span><span class="t">${m.label}</span>`;
    el.addEventListener("click", () => select(m.place, true));
    $("markers").append(el); return el;
  });

  // Route
  let progress = 0; // 0..1 across both legs
  const routeD = () => {
    const pts = [...LEG1, ...LEG2.slice(1)].map(project);
    return pts.map((p, i) => (i ? "L" : "M") + p.x.toFixed(1) + " " + p.y.toFixed(1)).join("");
  };
  function place() {
    LABELS.forEach((l, i) => { const p = project(l.at); labelEls[i].style.left = p.x + "px"; labelEls[i].style.top = p.y + "px"; });
    SHIELDS.forEach((s, i) => { const p = project(s.at); shieldEls[i].style.left = p.x + "px"; shieldEls[i].style.top = p.y + "px"; });
    MARKERS.forEach((m, i) => { const p = project(m.at); markerEls[i].style.left = p.x + "px"; markerEls[i].style.top = p.y + "px"; });
    const d = routeD();
    $("routeLine").setAttribute("d", d); $("routeMask").setAttribute("d", d);
    $("routeMask").setAttribute("stroke-dashoffset", String(1 - progress));
  }

  // Lengths of each leg (in projected px) let the route draw at constant speed and reveal markers on arrival.
  const legLen = (leg) => leg.reduce((s, ll, i) => i ? s + Math.hypot(ll[0] - leg[i - 1][0], (ll[1] - leg[i - 1][1]) * 1.26) : 0, 0);
  const split = legLen(LEG1) / (legLen(LEG1) + legLen(LEG2));
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const showMarker = (id) => { const el = markerEls[MARKERS.findIndex((m) => m.id === id)]; el.classList.remove("out"); el.classList.add("pop"); };
  function drawRoute(start) {
    showMarker("haight");
    if (reduce) { progress = 1; MARKERS.forEach((m) => showMarker(m.id)); place(); return; }
    const dur = 1900, t0 = performance.now() + start;
    let shownCam = false, shownEnd = false;
    const tick = (now) => {
      const t = Math.max(0, Math.min(1, (now - t0) / dur));
      progress = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      progress = .03 + progress * .97;
      if (!shownCam && progress >= split) { shownCam = true; showMarker("camera"); }
      if (!shownEnd && progress >= .985) { shownEnd = true; showMarker("pier"); setTimeout(() => showMarker("alcatraz"), 160); }
      $("routeMask").setAttribute("stroke-dashoffset", String(1 - progress));
      if (t < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  // ---------- Markers state ----------
  function syncMarkers() {
    MARKERS.forEach((m, i) => {
      const el = markerEls[i];
      el.setAttribute("aria-pressed", String(m.place === state.place && (m.id !== "pier")));
      el.dataset.off = String(m.id !== "pier" && !state.itinerary.includes(m.place));
      el.dataset.hide = String(!(state.group === "all" || state.group === m.group));
    });
  }

  // ---------- Detail panel ----------
  const detail = $("detail"), body = $("body");
  function renderDetail(id) {
    const p = PLACES[id];
    $("photos").innerHTML = "";
    p.photos.forEach(([src, alt], i) => {
      const fig = document.createElement("figure");
      const img = new Image(); img.alt = alt; img.decoding = "async"; img.referrerPolicy = "no-referrer";
      img.style.transitionDelay = i * 90 + "ms";
      img.onload = () => requestAnimationFrame(() => img.classList.add("in"));
      img.src = W(src); fig.append(img); $("photos").append(fig);
    });
    $("name").textContent = p.name; $("time").textContent = p.time;
    setText($("story"), p.story); setText($("before"), p.before);
    syncButton();
  }
  function syncButton() {
    const on = state.itinerary.includes(state.place);
    const b = $("itinBtn");
    b.setAttribute("aria-pressed", String(on));
    b.innerHTML = on ? "Remove from my itinerary" : SVG_PLUS + "Add to my day";
  }
  let swapping = null;
  function select(id, fromMap) {
    if (id === state.place) { if (fromMap) nudge(id); return; }
    state.place = id; save(); syncMarkers(); nudge(id);
    const from = detail.offsetHeight;
    detail.style.height = from + "px";
    body.classList.add("fade");
    clearTimeout(swapping);
    swapping = setTimeout(() => {
      renderDetail(id);
      detail.style.height = "auto";
      const to = detail.offsetHeight;
      detail.style.height = from + "px"; detail.offsetHeight;
      detail.style.height = to + "px";
      body.classList.remove("fade");
      setTimeout(() => { detail.style.height = ""; }, 480);
    }, 200);
  }
  function nudge(id) {
    if (!map || !ready) return;
    const c = map.getCenter(), t = PLACES[id].at;
    map.easeTo({ center: [c.lng + (t[0] - c.lng) * .3, c.lat + (t[1] - c.lat) * .3], duration: 800, easing: (x) => 1 - Math.pow(1 - x, 3) });
  }
  $("itinBtn").addEventListener("click", () => {
    const i = state.itinerary.indexOf(state.place);
    if (i >= 0) state.itinerary.splice(i, 1); else state.itinerary.push(state.place);
    save(); syncButton(); syncMarkers();
  });

  // ---------- Map controls ----------
  const expandBtn = $("expandBtn");
  const syncExpand = () => {
    mapEl.dataset.expanded = String(state.expanded);
    expandBtn.setAttribute("aria-pressed", String(state.expanded));
    $("expandLabel").textContent = state.expanded ? "Collapse" : "Expand";
    $("expandIcon").innerHTML = state.expanded
      ? '<path d="M8.5 4H6V1.5M6 4l2.7-2.7M1.5 6H4v2.5M4 6 1.3 8.7"/>'
      : '<path d="M6 1.5h2.5V4M8.5 1.5 5.8 4.2M4 8.5H1.5V6M1.5 8.5l2.7-2.7"/>';
  };
  expandBtn.addEventListener("click", () => { state.expanded = !state.expanded; syncExpand(); save(); });
  syncExpand();

  const menu = $("menu"), groupsBtn = $("groupsBtn"), infoBtn = $("infoBtn"), infopop = $("infopop");
  const LABEL = { all: "All groups", sights: "Sights", neighborhoods: "Neighborhoods" };
  const setMenu = (open) => { menu.classList.toggle("open", open); groupsBtn.setAttribute("aria-expanded", String(open)); if (open) setInfo(false); };
  const setInfo = (open) => { infopop.classList.toggle("open", open); infoBtn.setAttribute("aria-expanded", String(open)); if (open) setMenu(false); };
  groupsBtn.addEventListener("click", (e) => { e.stopPropagation(); setMenu(!menu.classList.contains("open")); if (menu.classList.contains("open")) menu.querySelector("[aria-checked=true]").focus(); });
  infoBtn.addEventListener("click", (e) => { e.stopPropagation(); setInfo(!infopop.classList.contains("open")); });
  menu.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-group]"); if (!b) return;
    state.group = b.dataset.group; save(); syncGroup(); setMenu(false); groupsBtn.focus();
  });
  menu.addEventListener("keydown", (e) => {
    const items = [...menu.querySelectorAll("button")], i = items.indexOf(document.activeElement);
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); items[(i + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length].focus(); }
    if (e.key === "Escape") { setMenu(false); groupsBtn.focus(); }
  });
  document.addEventListener("click", (e) => { if (!menu.contains(e.target)) setMenu(false); if (!infopop.contains(e.target)) setInfo(false); });
  function syncGroup() {
    $("groupsLabel").textContent = LABEL[state.group];
    menu.querySelectorAll("button").forEach((b) => b.setAttribute("aria-checked", String(b.dataset.group === state.group)));
    syncMarkers();
  }

  // ---------- Entrance ----------
  // Text streams in word by word, like the reference answer being written.
  const stream = (el, start, per) => {
    if (reduce) return start;
    const words = (el.dataset.text ?? el.textContent).split(/(\s+|\|)/);
    el.textContent = "";
    let i = 0;
    for (const w of words) {
      if (w === "|") { el.append(Object.assign(document.createElement("br"), { className: "sf-br" })); continue; }
      if (/^\s+$/.test(w) || !w) { el.append(w); continue; }
      const span = document.createElement("span"); span.className = "sf-w"; span.textContent = w;
      span.style.setProperty("--d", start + i++ * per + "ms"); el.append(span);
    }
    return start + i * per;
  };
  renderDetail(state.place);
  stream($("title"), 0, 40);
  stream($("subtitle"), 120, 12);
  [...body.children].forEach((el, i) => {
    el.classList.add("sf-enter"); el.style.setProperty("--d", 450 + i * 50 + "ms");
    el.addEventListener("animationend", (e) => { if (e.target === el) el.classList.remove("sf-enter", "go"); }, { once: false });
  });
  let tEnd = stream($("story"), 600, 8);
  stream($("before"), tEnd + 60, 8);
  syncGroup();
  setTimeout(() => document.querySelectorAll(".sf-enter").forEach((el) => el.classList.add("go")), 30);
  place();
  drawRoute(250);
})();
</script>
