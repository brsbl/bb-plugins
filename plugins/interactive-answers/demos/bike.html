<!-- width: 540 -->
<style>
  :root {
    --ink: #1c1c1c; --paper: #ffffff; --edge: #c9c9c9; --frame: #faf0a6; --frame-edge: #e2c41a; --frame-light: #fffbe2;
    --rim: #d2d2d2; --spoke: #8f8f8f; --hub: #dadada; --refl: #d9e04c; --drive: #3c3c3c; --mech: #9a9a9a;
    --diagram-bg: #fdfdfd; --diagram-border: #9cc7e6; --upper: color-mix(in srgb, var(--foreground) 3%, var(--card));
    --step-blue: #2b7fd6; --dim: .27;
  }
  :root[data-scheme=dark] {
    --ink: #f1f1f1; --paper: #2b2b2b; --edge: #565656; --frame: #8a7f2c; --frame-edge: #e3cf4a; --frame-light: #3e3919;
    --rim: #6a6a6a; --spoke: #a8a8a8; --hub: #4a4a4a; --drive: #d0d0d0; --mech: #8a8a8a;
    --diagram-bg: color-mix(in srgb, var(--foreground) 4%, var(--card)); --diagram-border: color-mix(in srgb, var(--ring) 50%, transparent);
    --step-blue: var(--ring); --dim: .3;
  }
  body { padding: 0; }
  .upper { background: var(--upper); padding: 21px 25px 23px; }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .ia-title { font-size: 19.5px; font-weight: 450; letter-spacing: -.015em; line-height: 1.2; }
  .ia-subtitle { margin-top: 2px; font-size: 11px; }
  .ia-seg { margin-top: 2px; padding: 2px; gap: 0; border-color: color-mix(in srgb, var(--foreground) 7%, transparent); }
  .ia-seg button { padding: 5.5px 10px; font-size: 11px; min-width: 70px; }
  .ia-seg button[aria-pressed=false] { color: var(--muted-foreground); }
  .ia-seg button[aria-pressed=false]:hover { color: var(--foreground); }

  .diagram { position: relative; margin-top: 9px; aspect-ratio: 1398 / 903; border: 1px solid var(--diagram-border); border-radius: 14px; background: var(--diagram-bg); overflow: hidden; animation: fade .6s .25s var(--ia-ease) both; }
  .diagram svg { width: 100%; height: 100%; max-width: none; overflow: visible; font-family: var(--font); }
  .caption { margin: 9px 0 0; font-size: 9.2px; color: var(--muted-foreground); animation: fade .5s .7s both; }
  @keyframes fade { from { opacity: 0; } }

  /* Parts: group opacity dims the parts that are not part of the current step. */
  .part { opacity: var(--dim); transition: opacity .45s var(--ia-ease); }
  .part.on { opacity: 1; }
  .mv { transition: transform .7s cubic-bezier(.65,0,.25,1); }
  /* Exploded: the drawing shrinks ~15% to make room while parts pull apart along their fitting axes. */
  .scene { transform-origin: 699px 470px; transition: transform .7s cubic-bezier(.65,0,.25,1); }
  .exploded .scene { transform: scale(.85); }
  .exploded .mv[data-m=handle] { transform: translate(40px, -160px); }
  .exploded .mv[data-m=saddle] { transform: translate(-45px, -150px); }
  .exploded .mv[data-m=rear] { transform: translate(-215px, 0px); }
  .exploded .mv[data-m=front] { transform: translate(215px, 0px); }
  .exploded .mv[data-m=drive] { transform: translate(0px, 90px); }
  .exploded .mv[data-m=pedalR] { transform: translate(60px, 150px); }
  .exploded .mv[data-m=pedalL] { transform: translate(-80px, -80px); }
  .frame-fill path { transition: stroke .7s; }
  .exploded .frame-fill path { stroke: var(--frame-light); }
  .guides, .frame-edge { opacity: 0; transition: opacity .4s; }
  .cable { transition: opacity .3s .3s; }
  .exploded .cable { opacity: 0; transition-delay: 0s; }
  .exploded .guides, .exploded .frame-edge { opacity: 1; transition: opacity .5s .35s; }
  .guides line { stroke: var(--step-blue); stroke-width: 2.4; stroke-dasharray: 7 7; opacity: .7; }

  .ink { fill: var(--ink); } .inks { stroke: var(--ink); fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .tube { fill: none; stroke-linecap: round; stroke-linejoin: round; }

  .callout { cursor: pointer; outline: none; }
  .callout circle { fill: var(--paper); stroke: color-mix(in srgb, var(--foreground) 30%, transparent); stroke-width: 2.2; transition: fill .4s, stroke .4s; }
  .callout text { font-size: 22px; font-weight: 500; fill: var(--muted-foreground); text-anchor: middle; dominant-baseline: central; transition: fill .4s; letter-spacing: .02em; }
  .callout:hover circle { stroke: var(--foreground); }
  .callout.on circle { fill: var(--foreground); stroke: var(--foreground); }
  .callout.on text { fill: var(--background); }
  .callout:focus-visible circle { stroke: var(--ring); stroke-width: 4; }
  .pop { transform-box: fill-box; transform-origin: center; animation: pop .45s var(--ia-ease) both; animation-delay: calc(1050ms + var(--i, 0) * 90ms); }
  @keyframes pop { from { opacity: 0; transform: scale(.6); } }

  /* Entrance: tubes and tyres draw on, then parts settle in. */
  .draw { stroke-dasharray: 1; animation: draw .9s cubic-bezier(.4,0,.2,1) both; animation-delay: var(--d, .35s); }
  @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  .rise { animation: rise .6s var(--ia-ease) both; animation-delay: var(--d, .7s); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }

  .lower { padding: 22px 25px 16px; }
  .stage { display: grid; }
  .stage > .step { grid-area: 1 / 1; }
  .step.in-next { animation: inNext .38s var(--ia-ease) both; }
  .step.in-prev { animation: inPrev .38s var(--ia-ease) both; }
  .step.out-next { animation: outNext .34s ease-in both; pointer-events: none; }
  .step.out-prev { animation: outPrev .34s ease-in both; pointer-events: none; }
  @keyframes inNext { from { opacity: 0; transform: translateX(32px); } }
  @keyframes inPrev { from { opacity: 0; transform: translateX(-32px); } }
  @keyframes outNext { to { opacity: 0; transform: translateX(-34px); } }
  @keyframes outPrev { to { opacity: 0; transform: translateX(34px); } }
  .eyebrow { margin: 0; font-size: 11px; font-weight: 500; color: var(--step-blue); }
  .step h3 { margin: 12px 0 0; font-size: 15px; font-weight: 400; letter-spacing: -.01em; line-height: 1.25; }
  .find { margin: 3px 0 0; font-size: 10.8px; color: var(--muted-foreground); }
  .body { margin: 12px 0 0; font-size: 11px; line-height: 1.52; letter-spacing: -.008em; }
  .check { display: grid; grid-template-columns: 14px 1fr; gap: 1px 9px; align-items: center; margin-top: 11px; font-size: 11px; cursor: pointer; }
  .check input { appearance: none; width: 14px; height: 14px; margin: 0; border: 1px solid color-mix(in srgb, var(--foreground) 28%, transparent); border-radius: 3px; background: var(--card); display: grid; place-items: center; cursor: pointer; transition: background .2s, border-color .2s; }
  .check input::after { content: ""; width: 7px; height: 4px; border: 1.6px solid var(--background); border-top: 0; border-right: 0; transform: translateY(-1px) rotate(-45deg) scale(0); transition: transform .2s var(--ia-ease); }
  .check input:checked { background: var(--foreground); border-color: var(--foreground); }
  .check input:checked::after { transform: translateY(-1px) rotate(-45deg) scale(1); }
  .check small { grid-column: 2; margin-top: 2px; font-size: 10.6px; color: var(--muted-foreground); }
  .s-line { animation: ia-reveal .5s var(--ia-ease) both; animation-delay: calc(var(--base, 0ms) + var(--i, 0) * 110ms); }

  .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; padding-top: 13px; border-top: 1px solid color-mix(in srgb, var(--foreground) 8%, transparent); }
  .ia-dots { gap: 5px; padding-left: 2px; }
  .ia-dots i { width: 4.5px; height: 4.5px; background: color-mix(in srgb, var(--foreground) 12%, transparent); }
  .ia-dots i[aria-current=step] { background: var(--step-blue); }
  .ia-dots i.done { background: color-mix(in srgb, var(--step-blue) 35%, transparent); }
  .nav { display: flex; gap: 6px; }
  .nav .ia-btn { min-height: 32px; padding: 0 13px; font-size: 12px; }
  #back { min-width: 49px; color: var(--muted-foreground); border-color: color-mix(in srgb, var(--foreground) 9%, transparent); }
  #back:disabled { opacity: .5; }
  #next { min-width: 55px; padding: 0 12px; }
  #next:disabled { opacity: .35; }
</style>

<div class="upper">
  <div class="head">
    <div>
      <h2 class="ia-title ia-reveal" style="--i:0">Rocket Youth Bike</h2>
      <p class="ia-subtitle ia-reveal" style="--i:1">Assembly instructions</p>
    </div>
    <div class="ia-seg ia-reveal" style="--i:2" role="group" aria-label="Diagram view">
      <button type="button" data-view="assembled" aria-pressed="true">Assembled</button>
      <button type="button" data-view="exploded" aria-pressed="false">Exploded</button>
    </div>
  </div>
  <div class="diagram" id="diagram">
    <svg viewBox="0 0 1398 903" role="img" aria-labelledby="bike-label">
      <title id="bike-label">Side view of a 20-inch youth bike with numbered parts</title>
      <g id="art" class="scene"></g>
    </svg>
  </div>
  <p class="caption">Illustrative exploded schematic, not a scale-accurate workshop drawing.</p>
</div>

<div class="lower">
  <div class="stage" id="stage" aria-live="polite"></div>
  <div class="foot s-line" style="--base:1500ms;--i:0">
    <div class="ia-dots" id="dots" aria-hidden="true"></div>
    <div class="nav">
      <button type="button" class="ia-btn" id="back">Back</button>
      <button type="button" class="ia-btn ia-btn-primary" id="next">Next →</button>
    </div>
  </div>
</div>

<script>
(() => {
  const ALL = ["handle", "saddle", "pedals", "front", "rear", "drive"];
  const STEPS = [
    { title: "Check the parts", find: "Everything in the box", parts: ALL,
      body: "Lay the frame, wheels, handlebar, saddle, and pedals on a clean, open surface. Compare them with the parts list in your manual before you start.",
      check: "Parts list checked", note: "Confirm every part and hardware bag is present and undamaged." },
    { title: "Attach the handlebar", find: "Handlebar and stem", parts: ["handle"],
      body: "The highlighted handlebar fits into the stem above the fork. Line it up with the front wheel, then follow the manual's clamping and tightening directions.",
      check: "Handlebar checked", note: "Confirm it is centered, straight, and does not turn independently of the wheel." },
    { title: "Set the saddle", find: "Saddle and seatpost", parts: ["saddle"],
      body: "Slide the highlighted seatpost into the seat tube. Keep the minimum-insertion mark inside the frame and set a height that suits the rider.",
      check: "Saddle height checked", note: "Confirm the clamp is closed and the saddle does not twist." },
    { title: "Match the pedals", find: "Left and right pedals", parts: ["pedals"],
      body: "Identify each pedal's L or R marking before installation. The pedals belong on opposite crank arms; follow the manual's threading and tightening directions.",
      check: "Both pedals checked", note: "Confirm the correct side and secure installation for each pedal." },
    { title: "Fit the front wheel", find: "Front wheel and its supplied hardware", parts: ["front"],
      body: "The highlighted wheel belongs between the front fork ends. Use the separated view to see the relationship before following your model's wheel-fitting instructions.",
      check: "Wheel fitting checked", note: "Confirm the retention hardware and brake setup against the manual." },
    { title: "Do a final safety check", find: "The assembled bike", parts: ALL,
      body: "Squeeze both brakes, spin each wheel, and check that the handlebar, saddle, and pedals are secure. Ask a qualified mechanic to inspect anything you are unsure about.",
      check: "Safety check complete", note: "Confirm brakes, tire pressure, and fasteners against the manual before the first ride." },
  ];
  const CALLOUTS = [
    { n: "01", part: "handle", step: 1, x: 1160, y: 180, m: "handle" },
    { n: "02", part: "saddle", step: 2, x: 433, y: 210, m: "saddle" },
    { n: "03", part: "pedals", step: 3, x: 634, y: 767, m: "pedalR" },
    { n: "04", part: "front", step: 4, x: 1137, y: 633, m: "front" },
  ];

  // ---- Illustration (viewBox 1398 x 903) ----
  const wheel = (cx, cy) => {
    let spokes = "";
    for (let i = 0; i < 20; i++) {
      const a = (i / 20) * Math.PI * 2, b = a + (i % 2 ? 0.42 : -0.42);
      spokes += `<line x1="${(cx + 17 * Math.cos(a)).toFixed(1)}" y1="${(cy + 17 * Math.sin(a)).toFixed(1)}" x2="${(cx + 156 * Math.cos(b)).toFixed(1)}" y2="${(cy + 156 * Math.sin(b)).toFixed(1)}"/>`;
    }
    return `
      <circle cx="${cx}" cy="${cy}" r="190" fill="none" stroke="var(--ink)" stroke-width="9" stroke-dasharray="4.6 3.9"/>
      <circle class="draw" style="--d:.3s" pathLength="1" cx="${cx}" cy="${cy}" r="178" fill="none" stroke="var(--ink)" stroke-width="26"/>
      <circle cx="${cx}" cy="${cy}" r="161" fill="none" stroke="var(--rim)" stroke-width="10"/>
      <circle cx="${cx}" cy="${cy}" r="155.5" fill="none" stroke="var(--spoke)" stroke-width="1.5" opacity=".6"/>
      <g stroke="var(--spoke)" stroke-width="2">${spokes}</g>
      <circle cx="${cx}" cy="${cy}" r="21" fill="var(--hub)" stroke="var(--spoke)" stroke-width="2"/>
      <circle cx="${cx}" cy="${cy}" r="8" class="ink"/>
      <path d="M${cx + 2} ${cy + 118} v24" stroke="var(--ink)" stroke-width="4.5" stroke-linecap="round"/>`;
  };
  // A white tube with a thin outline: outline stroke underneath, paper stroke on top.
  const tube = (d, w) => `<path class="tube" d="${d}" stroke="var(--edge)" stroke-width="${w + 4}"/><path class="tube" d="${d}" stroke="var(--paper)" stroke-width="${w}"/>`;
  const FRAME = [["M552 412 L648 424 L932 304", 46], ["M547 388 L616 614", 44], ["M944 362 L632 606", 46], ["M934 290 L948 382", 50]];
  const frameEdge = FRAME.map(([d, w]) => `<path class="tube" d="${d}" stroke="var(--frame-edge)" stroke-width="${w + 18}"/>`).join("");
  const frameFill = FRAME.map(([d, w], i) => `<path class="tube draw" style="--d:${0.35 + i * 0.12}s" pathLength="1" d="${d}" stroke="var(--frame)" stroke-width="${w}"/>`).join("");

  const art = `
    <g class="guides">
      <line x1="317" y1="607" x2="117" y2="607"/><line x1="1050" y1="607" x2="1250" y2="607"/>
      <line x1="547" y1="388" x2="501" y2="240"/><line x1="922" y1="232" x2="956" y2="74"/>
      <line x1="620" y1="622" x2="620" y2="700"/><line x1="702" y1="787" x2="760" y2="842"/>
    </g>
    <g class="mv" data-m="rear"><g class="part" data-part="rear"><g class="rise" style="--d:.3s">${wheel(317, 607)}</g></g></g>
    <g class="rise" style="--d:.45s">
      ${tube("M548 440 L330 604", 22)}
      ${tube("M322 609 L612 622", 22)}
      <path d="M470 463 Q560 452 652 446" fill="none" stroke="var(--edge)" stroke-width="3"/>
      <g fill="var(--mech)" opacity=".55"><rect x="397" y="494" width="32" height="28" rx="5"/><circle cx="440" cy="497" r="12"/></g>
      <circle cx="440" cy="497" r="5" fill="var(--paper)"/>
    </g>
    <g class="frame-edge">${frameEdge}</g>
    <g class="frame-fill">${frameFill}</g>
    <g class="mv" data-m="pedalL"><g class="part" data-part="pedals"><g class="rise" style="--d:.8s">
      <rect x="520" y="535" width="62" height="24" rx="4" class="ink"/>
      <rect x="526" y="540" width="11" height="14" rx="2" fill="var(--refl)"/>
      <circle cx="566" cy="547" r="9.5" fill="var(--paper)" stroke="var(--ink)" stroke-width="3"/>
    </g></g></g>
    <g class="mv" data-m="drive"><g class="part" data-part="drive"><g class="rise" style="--d:.65s">
      <path d="M352 585 L590 583" stroke="var(--drive)" stroke-width="32" stroke-linecap="round" fill="none"/>
      <circle cx="620" cy="622" r="47" fill="none" stroke="var(--drive)" stroke-width="22"/>
      <path d="M332 626 L604 667" stroke="var(--drive)" stroke-width="5" stroke-linecap="round"/>
      <path d="M500 628 L489 664" stroke="var(--drive)" stroke-width="9" stroke-linecap="round"/>
      ${tube("M620 622 L702 697", 19)}
      <circle cx="620" cy="622" r="23" fill="var(--frame)"/>
      <circle cx="620" cy="622" r="8.5" class="ink"/>
    </g></g></g>
    <g class="rise" style="--d:.55s">
      ${tube("M944 300 L922 234", 30)}
      <g fill="var(--mech)" opacity=".55">
        <rect x="987" y="398" width="22" height="58" rx="5" transform="rotate(-20 998 427)"/>
        <rect x="1012" y="448" width="30" height="46" rx="7" transform="rotate(-22 1027 471)"/>
        <rect x="895" y="398" width="8" height="24" rx="3" transform="rotate(-40 899 410)"/>
      </g>
      <circle cx="1024" cy="472" r="5" fill="var(--paper)"/>
    </g>
    <g class="mv" data-m="front"><g class="part" data-part="front"><g class="rise" style="--d:.4s">${wheel(1050, 607)}</g></g></g>
    <g class="rise" style="--d:.6s"><g opacity=".8">${tube("M950 372 Q996 478 1048 604", 24)}</g></g>
    <g class="mv" data-m="handle"><g class="part" data-part="handle"><g class="rise" style="--d:.75s">
      <path class="inks" stroke-width="22" d="M790 129 L838 132 Q876 138 886 186 Q894 226 918 228 Q946 229 960 186 Q976 128 1014 125 L1060 127"/>
      <path class="inks" stroke-width="13" d="M858 152 L1046 152"/>
      <path class="inks" stroke-width="34" d="M752 127 L812 128"/>
      <path class="inks" stroke-width="30" d="M1022 125 L1076 128"/>
      <path class="inks" stroke-width="9" d="M876 150 Q838 151 798 163"/>
      <path class="inks" stroke-width="9" d="M1032 148 Q1068 151 1102 162"/>
      <path class="inks cable" stroke-width="3" d="M990 168 Q944 262 993 396"/>
      <path class="inks cable" stroke-width="3" d="M962 192 Q912 252 866 336"/>
    </g></g></g>
    <g class="mv" data-m="saddle"><g class="part" data-part="saddle"><g class="rise" style="--d:.7s">
      <path class="inks" stroke-width="26" d="M514 300 L544 386"/>
      <path class="ink" d="M425 285 C420 258 445 252 475 256 L612 262 C636 265 642 280 628 292 C600 304 560 300 535 306 L478 316 C440 318 428 302 425 285 Z"/>
    </g></g></g>
    <g class="rise" style="--d:.7s">${tube("M530 383 L566 376", 15)}</g>
    <g class="mv" data-m="pedalR"><g class="part" data-part="pedals"><g class="rise" style="--d:.85s">
      <rect x="654" y="684" width="98" height="28" rx="4" class="ink"/>
      <rect x="661" y="689" width="11" height="18" rx="2" fill="var(--refl)"/>
      <rect x="734" y="689" width="11" height="18" rx="2" fill="var(--refl)"/>
      <rect x="682" y="694" width="44" height="8" rx="2" fill="var(--paper)" opacity=".18"/>
    </g></g></g>
    ${CALLOUTS.map((c, i) => `<g class="mv" data-m="${c.m}"><g class="callout pop" style="--i:${i}" role="button" tabindex="0" data-step="${c.step}" data-part="${c.part}" aria-label="Part ${c.n}: go to step ${c.step + 1}"><circle cx="${c.x}" cy="${c.y}" r="30"/><text x="${c.x}" y="${c.y + 1}">${c.n}</text></g></g>`).join("")}`;
  document.getElementById("art").innerHTML = art;

  // ---- State ----
  const saved = window.answer && window.answer.state;
  let step = Number.isInteger(saved?.step) ? Math.min(Math.max(saved.step, 0), STEPS.length - 1) : 3;
  let view = saved?.view === "exploded" ? "exploded" : "assembled";
  let checked = STEPS.map((_, i) => Boolean(saved?.checked?.[i]));
  const save = () => window.answer?.save({ step, view, checked });

  const diagram = document.getElementById("diagram");
  const stage = document.getElementById("stage");
  const dots = document.getElementById("dots");
  const back = document.getElementById("back");
  const next = document.getElementById("next");
  dots.innerHTML = STEPS.map(() => "<i></i>").join("");

  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  function stepMarkup(i, base) {
    const s = STEPS[i];
    const line = (n, cls = "") => `class="${cls} s-line" style="--base:${base}ms;--i:${n}"`;
    return `<p ${line(0, "eyebrow")}>Step ${i + 1} of ${STEPS.length}</p>
      <h3 ${line(1)}>${esc(s.title)}</h3>
      <p ${line(2, "find")}>Find · ${esc(s.find)}</p>
      <p ${line(3, "body")}>${esc(s.body)}</p>
      <label ${line(4, "check")}><input type="checkbox" ${checked[i] ? "checked" : ""}><span>${esc(s.check)}</span><small>${esc(s.note)}</small></label>`;
  }

  function paint() {
    const on = new Set(STEPS[step].parts);
    const all = on.size > 1;
    document.querySelectorAll(".part").forEach((g) => g.classList.toggle("on", on.has(g.dataset.part)));
    document.querySelectorAll(".callout").forEach((g) => {
      const active = !all && on.has(g.dataset.part);
      g.classList.toggle("on", active);
      g.setAttribute("aria-current", active ? "step" : "false");
    });
    diagram.classList.toggle("exploded", view === "exploded");
    document.querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === view)));
    [...dots.children].forEach((d, i) => {
      if (i === step) d.setAttribute("aria-current", "step"); else d.removeAttribute("aria-current");
      d.classList.toggle("done", i !== step && checked[i]);
    });
    back.disabled = step === 0;
    const last = step === STEPS.length - 1;
    next.textContent = last ? (checked[step] ? "Done ✓" : "Done") : "Next →";
    next.disabled = last && checked[step];
  }

  function show(i, dir, base = 0) {
    const old = stage.querySelector(".step:not(.out-next):not(.out-prev)");
    const el = document.createElement("div");
    el.className = "step" + (dir ? (dir > 0 ? " in-next" : " in-prev") : "");
    el.innerHTML = stepMarkup(i, base);
    if (dir) el.querySelectorAll(".s-line").forEach((n) => n.classList.remove("s-line"));
    el.querySelector("input").addEventListener("change", (e) => { checked[i] = e.target.checked; paint(); save(); });
    if (old) {
      old.classList.add(dir > 0 ? "out-next" : "out-prev");
      old.setAttribute("aria-hidden", "true");
      old.querySelector("input").tabIndex = -1;
      setTimeout(() => old.remove(), 360);
    }
    stage.appendChild(el);
  }

  function go(i) {
    if (i === step || i < 0 || i >= STEPS.length) return;
    const dir = i > step ? 1 : -1;
    step = i; show(step, dir); paint(); save();
  }

  back.addEventListener("click", () => go(step - 1));
  next.addEventListener("click", () => {
    if (step < STEPS.length - 1) return go(step + 1);
    checked[step] = true;
    const box = stage.querySelector(".step:last-child input"); if (box) box.checked = true;
    paint(); save();
  });
  document.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", () => { view = b.dataset.view; paint(); save(); }));
  document.querySelectorAll(".callout").forEach((g) => {
    const act = () => go(Number(g.dataset.step));
    g.addEventListener("click", act);
    g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(); } });
  });

  show(step, 0, 1050);
  paint();
})();
</script>
