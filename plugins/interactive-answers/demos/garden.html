<style>
  body { padding: 8px 8px 18px; font-size: 14px; }
  :root { --g-tile: #d1ebca; --g-tile-on: #c2e3ba; --g-ink: #3f9a4a; --t-tile: #efe0c6; --t-tile-on: #e6d2b0; --t-ink: #b07a3a; }
  :root[data-scheme=dark] { --g-tile: #24382a; --g-tile-on: #2b4532; --g-ink: #7fcb87; --t-tile: #3a3125; --t-tile-on: #45392a; --t-ink: #d9a565; }

  /* Photo bento: one tall photo, two stacked. */
  .bento { display: grid; grid-template-columns: 59fr 41fr; grid-template-rows: 1fr 1fr; gap: 4px; height: 252px; border-radius: 14px; overflow: hidden; }
  .bento figure { margin: 0; position: relative; overflow: hidden; background: color-mix(in srgb, var(--g-tile) 60%, var(--muted)); }
  .bento figure:first-child { grid-row: 1 / 3; }
  .bento img { width: 100%; height: 100%; object-fit: cover; }
  .ph { animation: ph-in .55s var(--ia-ease) both; animation-delay: calc(var(--i) * 60ms); }
  .ph img { animation: ph-img .7s var(--ia-ease) both; animation-delay: calc(var(--i) * 60ms); }
  @keyframes ph-in { from { opacity: 0; } }
  @keyframes ph-img { from { transform: scale(1.08); filter: blur(6px) saturate(.6) brightness(1.15); } }

  /* Plan */
  .plan { margin: 9px 0 0; padding: 15px 5px 5px; border-radius: 16px; border: 1px solid color-mix(in srgb, var(--border) 50%, transparent); }
  .plan h3 { margin: 0 8px; font-size: 19.5px; line-height: 1.25; font-weight: 500; letter-spacing: -.012em; }
  .plan .sub { margin: 5px 8px 0; font-size: 13px; line-height: 1.3; color: var(--muted-foreground); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 12px; }
  .tile { --bg: var(--g-tile); --bg-on: var(--g-tile-on); --ink: var(--g-ink);
    position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
    height: 136px; padding: 10px 8px 12px; border: 1px solid transparent; border-radius: 11px; background: var(--bg); color: var(--foreground); text-align: center;
    transition: transform .28s var(--ia-ease), box-shadow .28s var(--ia-ease), background-color .28s, border-color .28s, opacity .28s; }
  .tile.tan { --bg: var(--t-tile); --bg-on: var(--t-tile-on); --ink: var(--t-ink); }
  .tile svg { width: 40px; height: 40px; margin-bottom: 6px; color: var(--ink); fill: none; stroke: currentColor; stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; transition: transform .35s var(--ia-ease); }
  .tile b { font-weight: 550; font-size: 16.5px; line-height: 1.2; letter-spacing: -.005em; }
  .tile span { margin-top: 2px; font-size: 14px; line-height: 1.25; color: color-mix(in srgb, var(--foreground) 88%, var(--bg)); }
  .tile:hover { background: var(--bg-on); }
  .tile:hover svg { transform: translateY(-1px) scale(1.06); }
  .tile:active { transform: scale(.985); }
  .tile[aria-pressed=true] { background: var(--bg-on); border-color: color-mix(in srgb, var(--ink) 55%, transparent); transform: translateY(-2px);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--ink) 22%, transparent), 0 6px 16px -8px color-mix(in srgb, var(--ink) 60%, transparent); }
  .grid.has-sel .tile[aria-pressed=false] { opacity: .82; }
  .tile.pop { animation: pop .5s cubic-bezier(.3,1.35,.5,1) both; animation-delay: calc(300ms + var(--i) * 50ms); }
  @keyframes pop { from { opacity: 0; transform: scale(.9) translateY(4px); } }

  /* Detail row */
  .more { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .38s var(--ia-ease); }
  .more.open { grid-template-rows: 1fr; }
  .more > div { overflow: hidden; min-height: 0; }
  .card { margin-top: 7px; padding: 11px 12px 12px; border-radius: 11px; background: color-mix(in srgb, var(--ink) 9%, var(--card)); border: 1px solid color-mix(in srgb, var(--ink) 20%, transparent); opacity: 0; transform: translateY(-4px); transition: opacity .3s, transform .38s var(--ia-ease); }
  .more.open .card { opacity: 1; transform: none; }
  .card .hd { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500; }
  .card .hd svg { width: 18px; height: 18px; color: var(--ink); fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 9px 0 0; }
  .stats dt { font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted-foreground); font-weight: 500; }
  .stats dd { margin: 2px 0 0; font-size: 12.5px; line-height: 1.35; }
  .card p { margin: 9px 0 0; font-size: 12px; line-height: 1.4; color: var(--muted-foreground); }
  .card.swap .hd, .card.swap .stats, .card.swap p { animation: swap .32s var(--ia-ease); }
  @keyframes swap { from { opacity: 0; transform: translateX(6px); } }

  .note { margin: 14px 3px 0; font-size: 14.5px; line-height: 1.45; }
  .rv { animation: ia-reveal .38s var(--ia-ease) both; }
  /* Hold the entrance until the photos have loaded (or 1.2 s), so the morph is seen. */
  body:not(.go) :is(.ph, .ph img, .rv, .tile.pop) { animation-play-state: paused; }
</style>

<div class="bento" aria-label="Small-space container gardens">

  <div class="more" id="more" aria-live="polite"><div><div class="card" id="card"></div></div></div>
</section>

<p class="note rv" style="animation-delay:380ms">Keep enough room to reach and water every pot. Place the trellis on the north side so the peas don't shade the rest.</p>

<script>
(() => {
  const INFO = {
    lettuce: { name: "Lettuce + radishes", tan: false, sun: "Part shade OK, 4–6 h", spacing: "Lettuce 6–8 in; radishes 1–2 in", harvest: "Radishes ~30 days; lettuce 30–50", note: "Sow radishes between the lettuce. They're pulled before the lettuce fills in." },
    peas: { name: "Snap peas", tan: false, sun: "Full sun, 6+ h", spacing: "2 in apart on the trellis", harvest: "~60 days", note: "A cool-season crop. Sow in early spring or late summer for fall." },
    kale: { name: "Kale", tan: true, sun: "Full sun to part shade", spacing: "1 plant per 12-inch pot", harvest: "55–65 days", note: "Pick the outer leaves and it keeps producing for months." },
    herbs: { name: "Herbs", tan: true, sun: "Full sun to part shade", spacing: "1 herb per small pot", harvest: "Cilantro ~50 days; parsley 70–90", note: "Cilantro bolts in summer heat. Parsley is slow to germinate, so give it 2–4 weeks." },
  };
  const grid = document.querySelector(".grid");
  const tiles = [...grid.querySelectorAll(".tile")];
  const more = document.getElementById("more");
  const card = document.getElementById("card");
  let selected = null, touched = false;

  function render(animate) {
    grid.classList.toggle("has-sel", !!selected);
    for (const t of tiles) t.setAttribute("aria-pressed", String(t.dataset.k === selected));
    if (!selected) { more.classList.remove("open"); return; }
    const d = INFO[selected], tile = tiles.find((t) => t.dataset.k === selected);
    const wasOpen = more.classList.contains("open");
    card.style.setProperty("--ink", d.tan ? "var(--t-ink)" : "var(--g-ink)");
    card.innerHTML = `<div class="hd">${tile.querySelector("svg").outerHTML}${d.name}</div>
      <dl class="stats"><div><dt>Sun</dt><dd>${d.sun}</dd></div><div><dt>Spacing</dt><dd>${d.spacing}</dd></div><div><dt>First harvest</dt><dd>${d.harvest}</dd></div></dl>
      <p>${d.note}</p>`;
    if (animate && wasOpen) { card.classList.remove("swap"); void card.offsetWidth; card.classList.add("swap"); }
    more.classList.add("open");
  }

  grid.addEventListener("click", (e) => {
    const t = e.target.closest(".tile"); if (!t) return;
    touched = true;
    selected = selected === t.dataset.k ? null : t.dataset.k;
    render(true);
    window.answer.save({ selected });
  });
  // Drop the entrance class once it has played so hover/press transforms work.
  for (const t of tiles) t.addEventListener("animationend", () => t.classList.remove("pop"), { once: true });

  const imgs = [...document.querySelectorAll(".bento img")];
  let started = false;
  const go = () => {
    if (started) return; started = true;
    document.body.classList.add("go");
    const saved = window.answer.state;
    if (saved && INFO[saved.selected]) setTimeout(() => { if (!touched) { selected = saved.selected; render(false); } }, 650);
  };
  Promise.all(imgs.map((i) => i.complete ? 0 : new Promise((r) => { i.onload = i.onerror = r; }))).then(go);
  setTimeout(go, 120);

})();
</script>
