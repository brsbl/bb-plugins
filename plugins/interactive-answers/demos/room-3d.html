<style>
  body { padding: 20px 20px 22px; }

  @keyframes shimmer { to { background-position: -150% 0; } }
  /* Frosted-glass toolbar, after the reference's pill groups */
  .bar { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; gap: 8px; pointer-events: none; }
  .glass { pointer-events: auto; display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: rgba(250, 248, 244, .58); backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4); box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 4px 14px rgba(0,0,0,.12); }
  .glass button { display: inline-flex; align-items: center; gap: 5px; border: 0; border-radius: 999px; padding: 5px 9px; background: transparent; font-size: 10.5px; font-weight: 500; color: #3a3833; white-space: nowrap; transition: background .25s, color .25s; }
  .glass button[aria-pressed=true] { background: rgba(58, 62, 48, .82); color: #fff; }
  .glass button i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .glass svg { width: 12px; height: 12px; }
  /* Narrow answers: icon-only camera toggle and compact chips so all four times fit. */
  @media (max-width: 460px) {
    .bar { top: 8px; left: 8px; right: 8px; gap: 6px; }
    .glass button { padding: 5px 7px; font-size: 10px; gap: 0; }

    #dof .t { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  }
  .hint { position: absolute; left: 12px; bottom: 10px; font-size: 10px; color: rgba(255,255,255,.85); text-shadow: 0 1px 2px rgba(0,0,0,.35); pointer-events: none; transition: opacity .6s; }
  .sel { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
  .sel b { width: 22px; height: 22px; border-radius: 6px; background: #ece5da; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); transition: background .5s; }
  .sel .n { font-size: 13px; font-weight: 500; color: var(--ia-ink); }
  .row { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }

  .sw { position: relative; display: block; padding: 0; border: 0; background: none; text-align: left; border-radius: 12px; }
  .sw .chip { display: block; aspect-ratio: 4 / 3; border-radius: 11px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); transition: transform .2s; }
  .sw:hover .chip { transform: translateY(-1px); }
  .sw .nm { display: block; margin: 6px 2px 0; font-size: 11.5px; font-weight: 500; color: var(--ia-ink); }
  .sw .hx { display: block; margin: 1px 2px 0; font-size: 10.5px; color: var(--ia-meta); }
  .sw::after { content: ""; position: absolute; inset: -4px -4px auto -4px; aspect-ratio: 4 / 3; height: calc(100% - 32px); border-radius: 14px; box-shadow: 0 0 0 1.5px var(--ia-ink); opacity: 0; transform: scale(.97); transition: opacity .2s, transform .2s; }

  .sw .ok { position: absolute; top: 6px; right: 6px; width: 16px; height: 16px; border-radius: 50%; background: var(--ia-ink); color: var(--card); display: grid; place-items: center; opacity: 0; transition: opacity .2s; }

  .ok svg { width: 9px; height: 9px; }
  .err { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; text-align: center; font-size: 12px; color: var(--ia-meta); background: var(--ia-stage); }

const scene = new THREE.Scene();

{ const g = artCanvas.getContext("2d"); const sky = g.createLinearGradient(0, 0, 0, 300); sky.addColorStop(0, "#c9d6d8"); sky.addColorStop(1, "#efe3cf"); g.fillStyle = sky; g.fillRect(0, 0, 360, 460);

const oak = new THREE.MeshStandardMaterial({ color: "#a77b4f", roughness: .5, envMapIntensity: .6 });
const AX = -0.5, AY = 1.48, AW = 0.56, AH = 0.72;
box(AW + 0.06, AH + 0.06, 0.035, oak, AX, AY, Z0 + 0.0175);
box(AW - 0.02, AH - 0.02, 0.006, trimMat, AX, AY, Z0 + 0.037, false);
const art = new THREE.Mesh(new THREE.PlaneGeometry(AW - 0.14, AH - 0.14), new THREE.MeshStandardMaterial({ map: artTex, roughness: .85, envMapIntensity: .4 }));
art.position.set(AX, AY, Z0 + 0.041); art.receiveShadow = true; room.add(art);

// Rug: woven wool from a small procedural texture
const rugCanvas = document.createElement("canvas"); rugCanvas.width = rugCanvas.height = 256;
{ const g = rugCanvas.getContext("2d"); g.fillStyle = "#d9cfbd"; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 9000; i++) { g.fillStyle = `rgba(${Math.random() < .5 ? "120,100,80" : "255,255,255"},${Math.random() * .08})`; g.fillRect(Math.random() * 256, Math.random() * 256, 2, 1); }
  g.strokeStyle = "rgba(150,120,90,.35)"; g.lineWidth = 6; g.strokeRect(14, 14, 228, 228); g.lineWidth = 2; g.strokeRect(26, 26, 204, 204); }
const rugTex = new THREE.CanvasTexture(rugCanvas); rugTex.colorSpace = THREE.SRGBColorSpace;
const rug = new THREE.Mesh(new THREE.PlaneGeometry(2.1, 1.45), new THREE.MeshStandardMaterial({ map: rugTex, roughness: 1, envMapIntensity: .3 }));
rug.rotation.x = -Math.PI / 2; rug.position.set(-0.85, 0.006, -0.55); rug.receiveShadow = true; room.add(rug);

// ---------- Outside: sky seen through the window ----------
const skyCanvas = document.createElement("canvas"); skyCanvas.width = 64; skyCanvas.height = 256;
const skyTex = new THREE.CanvasTexture(skyCanvas); skyTex.colorSpace = THREE.SRGBColorSpace;
const sky = new THREE.Mesh(new THREE.PlaneGeometry(14, 9), new THREE.MeshBasicMaterial({ map: skyTex, toneMapped: false }));
sky.position.set(-6.5, 2.4, -0.8); sky.rotation.y = Math.PI / 2; scene.add(sky);

sun.target.position.set(0, 0, -0.8); scene.add(sun, sun.target);
const windowLight = new THREE.RectAreaLight("#ffffff", 0, WZ1 - WZ0, WY1 - WY0);
windowLight.position.set(-W / 2 + 0.02, (WY0 + WY1) / 2, (WZ0 + WZ1) / 2); windowLight.lookAt(0, (WY0 + WY1) / 2 - 0.3, (WZ0 + WZ1) / 2); scene.add(windowLight);
const fill = new THREE.HemisphereLight("#ffffff", "#8a7560", 0); scene.add(fill);

// ---------- Furniture: Poly Haven glTF models (CC0, modeled in Blender) ----------
const MODELS = "https://dl.polyhaven.org/file/ph-assets/Models/gltf/1k/";
// Poly Haven serves each model's textures from Models/jpg/1k/<name>/, not beside the .gltf.
const place = (name, { x, z, rotY = 0, y = 0, wallZ = null, width = null }) => new Promise((resolve) => {
  const manager = new THREE.LoadingManager();
  manager.setURLModifier((url) => url.replace(`/gltf/1k/${name}/textures/`, `/jpg/1k/${name}/`));
  new GLTFLoader(manager).load(`${MODELS}${name}/${name}_1k.gltf`, ({ scene: obj }) => {
    obj.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; if (o.material) o.material.envMapIntensity = .7; } });
    if (width) { const s = new THREE.Box3().setFromObject(obj).getSize(new THREE.Vector3()); obj.scale.setScalar(width / Math.max(s.x, s.z)); }
    obj.rotation.y = rotY; obj.position.set(x, y, z);
    const b = new THREE.Box3().setFromObject(obj); obj.position.y += y - b.min.y;
    if (wallZ !== null) obj.position.z += wallZ - b.min.z;
    room.add(obj); resolve(obj);
  }, undefined, () => resolve(null));
});

// ---------- Post-processing: ambient occlusion, gentle bloom, depth of field ----------
// Multisampled, half-float target: post-processing otherwise drops antialiasing and bands the gradients.
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { samples: 4, type: THREE.HalfFloatType }));
composer.addPass(new RenderPass(scene, camera));
const gtao = new GTAOPass(scene, camera, 1, 1);
gtao.updateGtaoMaterial({ radius: 0.35, distanceExponent: 1.4, thickness: 1.2, scale: 1.1, samples: 16 });
gtao.blendIntensity = 0.85;
composer.addPass(gtao);
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.09, 0.25, 0.96); composer.addPass(bloom);
const bokeh = new BokehPass(scene, camera, { focus: 4.3, aperture: 0.0009, maxblur: 0.0045 }); composer.addPass(bokeh);
const focusPoint = new THREE.Vector3(-1.4, 0.7, -0.6); // the armchair
composer.addPass(new OutputPass());

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return;
  renderer.setSize(w, h, false); composer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); dirty = 2;
}
new ResizeObserver(resize).observe(stage);

// ---------- Animated state: paint and time of day ease between presets ----------
const cur = { time: { ...TIMES[state.time] }, back: new THREE.Color(), side: new THREE.Color() };
const target = { back: new THREE.Color(), side: new THREE.Color() };
const colorsFor = () => {
  const c = state.color || BASE_WALL;
  target.back.set(c); target.side.set(state.mode === "accent" ? BASE_WALL : c);
};
colorsFor(); cur.back.copy(target.back); cur.side.copy(target.side);
let anim = null, dirty = 2, idleSince = performance.now();
const C = (h) => new THREE.Color(h);
function applyTime(t) {
  const el = THREE.MathUtils.degToRad(t.elev), az = THREE.MathUtils.degToRad(t.az);
  sun.position.set(-Math.cos(el) * Math.cos(az) * 20, Math.sin(el) * 20 + 0.6, -Math.cos(el) * Math.sin(az) * 20 - 0.8);
  sun.color.copy(t.sunC); sun.intensity = Math.max(0, t.sunI) * (t.elev > 0 ? 1 : 0);
  windowLight.color.copy(t.winC); windowLight.intensity = t.winI;
  fill.color.copy(t.winC); fill.intensity = t.env * 0.5;
  scene.environmentIntensity = t.env;
  lampLight.intensity = t.lamp * 1.8; shadeMat.emissiveIntensity = t.lamp * 1.5;
  renderer.toneMappingExposure = t.exposure;
  drawSky(t.skyTopC, t.skyLowC);
}
const resolveTime = (k) => { const t = TIMES[k]; return { ...t, sunC: C(t.sun), winC: C(t.win), skyTopC: C(t.skyTop), skyLowC: C(t.skyLow) }; };
cur.time = resolveTime(state.time); applyTime(cur.time);
backMat.color.copy(cur.back); sideMat.color.copy(cur.side);

function transition() {
  const from = { ...cur.time, sunC: cur.time.sunC.clone(), winC: cur.time.winC.clone(), skyTopC: cur.time.skyTopC.clone(), skyLowC: cur.time.skyLowC.clone(), back: backMat.color.clone(), side: sideMat.color.clone() };
  const to = resolveTime(state.time); colorsFor();
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  anim = { from, to, start: performance.now(), dur: reduce ? 1 : 900 };
}
function step(now) {
  if (!anim) return false;
  const k = Math.min(1, (now - anim.start) / anim.dur), e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
  const { from, to } = anim, lerp = THREE.MathUtils.lerp;
  const t = {};
  for (const key of ["elev", "az", "sunI", "winI", "env", "lamp", "exposure"]) t[key] = lerp(from[key], to[key], e);
  for (const key of ["sunC", "winC", "skyTopC", "skyLowC"]) t[key] = from[key].clone().lerp(to[key], e);
  cur.time = t; applyTime(t);
  backMat.color.copy(from.back).lerp(target.back, e); sideMat.color.copy(from.side).lerp(target.side, e);
  if (k >= 1) anim = null;
  return true;
}

// ---------- Interaction ----------
document.addEventListener("click", (ev) => {
  const t = ev.target.closest("button"); if (!t) return;
  if (t.dataset.time) state.time = t.dataset.time;
  else if (t.dataset.mode) state.mode = t.dataset.mode;
  else if (t.dataset.hex) state.color = t.dataset.hex;
  else if (t.id === "dof") state.dof = !state.dof;
  else return;
  syncUi(); save(); transition(); idleSince = performance.now();
});
controls.addEventListener("start", () => { $("hint").style.opacity = 0; idleSince = performance.now(); });
controls.addEventListener("change", () => { dirty = 1; });

// ---------- Render loop: draws only while something is moving ----------
let base = null;
function frame(now) {
  requestAnimationFrame(frame);
  const moving = step(now);
  // A slow, small camera drift for the first seconds after load or interaction.
  const idle = now - idleSince;
  if (base && idle < 14000 && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const a = Math.sin(idle / 2600) * 0.05, f = Math.min(1, idle / 1500) * Math.min(1, (14000 - idle) / 2000);
    camera.position.set(base.x + a * f * 0.9, base.y + Math.sin(idle / 3700) * 0.02 * f, base.z - a * f * 0.4); dirty = 1;
  }
  const changed = controls.update();
  bokeh.enabled = state.dof; bokeh.uniforms.focus.value = camera.position.distanceTo(focusPoint);
  if (moving || changed || dirty > 0) { composer.render(); dirty = Math.max(0, dirty - 1); }
}

// Show the room as soon as its shell renders; furniture and textures stream in and fade up as they arrive.
resize(); base = camera.position.clone(); idleSince = performance.now(); dirty = 3;
requestAnimationFrame((now) => { frame(now); requestAnimationFrame(() => { $("load").hidden = true; }); });
const fadeIn = (obj) => {
  if (!obj) return;
  const mats = []; obj.traverse((o) => { if (o.isMesh) for (const m of [].concat(o.material)) { m.transparent = true; m.opacity = 0; mats.push(m); } });
  const t0 = performance.now(), reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const tick = (now) => { const k = reduce ? 1 : Math.min(1, (now - t0) / 450); for (const m of mats) m.opacity = k; dirty = 2; if (k < 1) requestAnimationFrame(tick); else for (const m of mats) m.transparent = false; };
  requestAnimationFrame(tick);
};
place("modern_arm_chair_01", { x: -1.55, z: -0.55, rotY: 0.95 }).then(fadeIn);
place("coffee_table_round_01", { x: -0.6, z: -0.45, width: 0.62 }).then(fadeIn);
place("potted_plant_01", { x: -2.05, z: -1.55 }).then(fadeIn);
// Textures load asynchronously; redraw once each arrives.
THREE.DefaultLoadingManager.onLoad = () => { dirty = 2; };
THREE.DefaultLoadingManager.onProgress = () => { dirty = 2; };
</script>
