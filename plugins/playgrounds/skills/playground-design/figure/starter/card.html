<header class="pg-reveal" style="--i:0">
  <h2 class="pg-title">Slide the carriage</h2>
  <p class="pg-subtitle">Move it and watch the gauge read the travel.</p>
</header>
<div class="pg-reveal" style="--i:1; margin-top:16px">{{figure}}</div>
<div class="pg-reveal" style="--i:2; margin-top:16px">
  <label class="pg-field">Carriage position<output id="position-out">62 mm</output><input id="position" type="range" min="0" max="100" step="1" value="62"></label>
</div>
