<!-- Connect Four: built from the game set (turn row, board, ui.game). A tap and the
     agent's move action take one path; your moves reach the agent through watch. -->
<style>:root { --pg-board: #1f4fb8; --pg-cell: #10306e; }</style>
<h2 class="pg-title pg-reveal">Connect Four</h2>
<p class="pg-subtitle pg-reveal">You're red. Tap a column to drop a disc; I'll answer on the board.</p>

<div data-pg="turn" class="pg-reveal" style="--i:1"></div>
<div data-pg="board" data-param="board" data-label="Board" data-rows="6" data-cols="7" data-shape="round" data-pieces="R:#e5484d:Red,Y:#f5c518:Yellow" class="pg-reveal" style="--i:2"></div>
<div class="pg-foot pg-reveal" style="--i:3">
  <details><summary>Rules</summary><p>Take turns dropping discs. Four in a row across, down or diagonally wins.</p></details>
  <div data-pg="agent" data-empty="Your move."></div>
</div>

<script>
(() => {
  const { ui } = window.playground;
  const lines = [[0, 1], [1, 0], [1, 1], [1, -1]];
  ui.game({
    you: "R", me: "Y",
    move(b, col, who) {
      const row = [5, 4, 3, 2, 1, 0].find((r) => !b[r][col]);
      if (row === undefined || col < 0 || col > 6) return null;
      b[row][col] = who;
      return b;
    },
    winner(b) {
      for (let r = 0; r < 6; r++) for (let c = 0; c < 7; c++) for (const [dr, dc] of lines) {
        const p = b[r][c]; if (!p) continue;
        let k = 1; while (k < 4 && b[r + dr * k]?.[c + dc * k] === p) k++;
        if (k === 4) return p;
      }
      return b.every((row) => row.every(Boolean)) ? "draw" : null;
    },
  });
})();
</script>
