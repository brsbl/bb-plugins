<!-- Connect Four: a game built only from base kit components. The agent plays with
     the board's own select action, so both players' moves take one path. -->
<style>:root { --pg-board: #1f4fb8; --pg-cell: #10306e; }</style>
<h2 class="pg-title pg-reveal">Connect Four</h2>
<p class="pg-subtitle pg-reveal">You're red. Tap a column, then tell me to move.</p>

<div class="pg-toolbar pg-reveal" style="--i:1; margin-top:14px">
  <span class="pg-badge" id="turn"></span><span class="pg-spacer"></span><button class="pg-btn" id="reset" type="button">New game</button>
</div>
<div data-pg="board" data-param="board" data-label="Board" data-rows="6" data-cols="7" data-shape="round" data-pieces="R:#e5484d:Red,Y:#f5c518:Yellow" class="pg-reveal" style="--i:2; margin-top:10px"></div>
<div data-pg="agent" data-empty="Your move. I'll answer when you say so." class="pg-reveal" style="--i:3; margin-top:12px"></div>

<script>
(() => {
  const { params: P, ui } = window.playground;
  P.define("turn", { options: [{ value: "R", label: "Red" }, { value: "Y", label: "Yellow" }, { value: "done", label: "Done" }], default: "R" });
  const empty = () => Array.from({ length: 6 }, () => Array(7).fill(""));
  function winner(b) {
    for (let r = 0; r < 6; r++) for (let c = 0; c < 7; c++) for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
      const p = b[r][c]; if (!p) continue;
      let k = 1; while (k < 4 && b[r + dr * k]?.[c + dc * k] === p) k++;
      if (k === 4) return p;
    }
    return b.every((row) => row.every(Boolean)) ? "draw" : null;
  }
  function status() {
    const w = winner(P.get("board")), t = document.getElementById("turn");
    t.textContent = w === "draw" ? "Draw" : w ? (w === "R" ? "You win" : "I win") : P.get("turn") === "R" ? "Your turn" : "My turn";
    t.dataset.tone = w === "R" ? "good" : w === "Y" ? "bad" : "";
  }
  // Both players' moves: a tap on any cell, or the agent's select action, drops a disc in that column.
  ui.on("select", ({ col, from }) => {
    const b = P.get("board").map((r) => r.slice()), who = P.get("turn");
    if (who === "done" || (from === "agent") !== (who === "Y")) return;
    const row = [5, 4, 3, 2, 1, 0].find((r) => !b[r][col]);
    if (row === undefined) return;
    b[row][col] = who;
    P.set("board", b);
    P.set("turn", winner(b) ? "done" : who === "R" ? "Y" : "R");
  });
  document.getElementById("reset").onclick = () => { P.set("board", empty()); P.set("turn", "R"); };
  P.on(status);
  status();
})();
</script>
