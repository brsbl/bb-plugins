<!-- Home budget: built from the calculator set (scrub sentence, answer, breakdown). -->
<style>:root { --pg-accent: #2f6fed; }</style>
<h2 class="pg-title pg-reveal">How much home can you afford?</h2>

<p class="pg-sentence pg-reveal" style="--i:1; margin-top:14px">
  I earn <span data-pg="scrub" data-param="income" data-label="Yearly income" data-prefix="$" data-min="30000" data-max="500000" data-step="1000" data-value="140000"></span> a year,
  pay <span data-pg="scrub" data-param="debts" data-label="Monthly debts" data-prefix="$" data-min="0" data-max="5000" data-step="50" data-value="400"></span> a month on other debts,
  and can put <span data-pg="scrub" data-param="down" data-label="Down payment" data-unit="%" data-min="0.03" data-max="0.5" data-step="0.01" data-value="0.2"></span> down
  at <span data-pg="scrub" data-param="rate" data-label="Mortgage rate" data-unit="%" data-min="2" data-max="12" data-step="0.05" data-value="6.5"></span> over
  <span data-pg="scrub" data-param="term" data-label="Term" data-unit="years" data-min="10" data-max="30" data-step="5" data-value="30"></span>.
</p>

<div data-pg="answer" data-name="price" class="pg-reveal" style="--i:2; margin-top:18px"></div>
<div data-pg="breakdown" data-name="monthly" class="pg-reveal" style="--i:3; margin-top:16px"></div>
<div data-pg="agent" class="pg-reveal" style="--i:4; margin-top:16px"></div>

<script>
(() => {
  const { params: P, ui } = window.playground;
  const usd = (n) => "$" + Math.round(n).toLocaleString("en-US");
  function update() {
    const v = P.all(), monthlyIncome = v.income / 12;
    // Housing gets 28% of income, less any debt above 8% (the 36% total-debt rule).
    const budget = Math.max(0, monthlyIncome * 0.28 - Math.max(0, v.debts - monthlyIncome * 0.08));
    const r = v.rate / 100 / 12, n = v.term * 12, perLoan = r ? r / (1 - Math.pow(1 + r, -n)) : 1 / n;
    const pmiRate = v.down < 0.2 ? 0.006 / 12 : 0;
    const price = budget / ((1 - v.down) * (perLoan + pmiRate) + 0.012 / 12);
    const loan = price * (1 - v.down);
    ui.answer("price", { label: "You can afford about", value: usd(Math.round(price / 1000) * 1000), detail: usd(price * v.down) + " down · " + usd(budget) + " a month, 28% of your income" });
    ui.breakdown("monthly", [
      { label: "Principal and interest", value: loan * perLoan, display: usd(loan * perLoan) },
      { label: "Property tax and insurance", value: price * 0.012 / 12, display: usd(price * 0.012 / 12) },
      { label: "Mortgage insurance", value: loan * pmiRate, display: usd(loan * pmiRate) },
    ]);
  }
  P.on(update);
  update();
})();
</script>
