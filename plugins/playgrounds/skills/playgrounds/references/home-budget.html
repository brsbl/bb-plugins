<!-- Home budget: a calculator built only from base kit components. -->
<h2 class="pg-title pg-reveal">How much home can you afford?</h2>
<p class="pg-subtitle pg-reveal">Change your numbers. Payments stay at 28% of gross income.</p>

<div class="pg-form pg-reveal" style="--i:1; margin-top:16px">
  <label data-pg="field" data-param="income" data-label="Yearly income" data-prefix="$" data-min="0" data-max="2000000" data-step="1000" data-value="140000"></label>
  <label data-pg="field" data-param="debts" data-label="Monthly debts" data-prefix="$" data-min="0" data-max="20000" data-step="50" data-value="400"></label>
  <label data-pg="field" data-param="rate" data-label="Mortgage rate" data-unit="%" data-min="0" data-max="15" data-step="0.05" data-value="6.5"></label>
  <label data-pg="select" data-param="term" data-label="Term" data-options="30:30 years,20:20 years,15:15 years" data-value="30"></label>
</div>
<div class="pg-reveal" style="--i:2; margin-top:14px">
  <div data-pg="slider" data-param="down" data-label="Down payment" data-unit="%" data-min="0" data-max="0.5" data-step="0.01" data-value="0.2"></div>
</div>

<dl data-pg="readouts" class="pg-reveal" style="--i:3; margin-top:16px">
  <div data-readout="price" data-label="Home price" data-answer></div>
  <div data-readout="payment" data-label="Monthly payment"></div>
  <div data-readout="dti" data-label="Debt to income"></div>
</dl>
<svg data-pg="chart" data-name="byRate" class="pg-reveal" style="--i:4; margin-top:16px" role="img" aria-label="Affordable price by mortgage rate"></svg>
<div data-pg="agent" class="pg-reveal" style="--i:5; margin-top:12px"></div>

<script>
(() => {
  const { params: P, ui } = window.playground;
  const usd = (n) => "$" + Math.round(n).toLocaleString("en-US");
  // Price where principal + interest + 1.2% yearly tax and insurance fill 28% of income.
  function price(rate, v) {
    const budget = Math.max(0, v.income / 12 * 0.28 - Math.max(0, v.debts - v.income / 12 * 0.08));
    const r = rate / 100 / 12, n = Number(v.term) * 12, perLoan = r ? r / (1 - Math.pow(1 + r, -n)) : 1 / n;
    return budget / ((1 - v.down) * perLoan + 0.012 / 12);
  }
  function update() {
    const v = P.all(), p = price(v.rate, v), monthly = v.income / 12 * 0.28, dti = (monthly + v.debts) / (v.income / 12);
    ui.show("price", usd(p), { note: usd(p * v.down) + " down" });
    ui.show("payment", usd(monthly), { note: "incl. tax and insurance" });
    ui.show("dti", Math.round(dti * 100) + "%", { tone: dti > 0.43 ? "bad" : dti > 0.36 ? "warn" : "good", note: dti > 0.43 ? "above most lenders' 43%" : "within lender limits" });
    const pts = []; for (let r = 3; r <= 9.01; r += 0.5) pts.push([r, price(r, v) / 1000]);
    ui.chart("byRate", { height: 140, x: { min: 3, max: 9, format: (x) => x + "%" }, y: { min: 0, format: (y) => "$" + Math.round(y) + "k" }, series: [{ points: pts, kind: "area", label: "Price" }], now: v.rate });
  }
  P.on(update);
  update();
})();
</script>
