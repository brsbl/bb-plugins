<!-- Tic-tac-toe: the same game set with a different board and rules. -->
<h2 class="pg-title pg-reveal">Tic-tac-toe</h2>
<p class="pg-subtitle pg-reveal">You're X and go first. Tap a square; I'll answer on the board.</p>

<div data-pg="turn" class="pg-reveal" style="--i:1"></div>
<div data-pg="board" data-param="board" data-label="Board" data-rows="3" data-cols="3" data-pieces="X::X,O::O" class="pg-reveal" style="--i:2"></div>
<div class="pg-foot pg-reveal" style="--i:3">
  <details><summary>Rules</summary><p>Three in a row across, down or diagonally wins.</p></details>
  <div data-pg="agent" data-empty="Your move."></div>
</div>

<script>
(() => {
  const { ui } = window.playground;
  const rows = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
  const names = ["top left", "top", "top right", "left", "center", "right", "bottom left", "bottom", "bottom right"];
  ui.game({
    you: "X", me: "O",
    fromCell: (r, c) => r * 3 + c,
    say: (i) => "the " + names[i] + " square",
    move(b, i, who) {
      const r = Math.floor(i / 3), c = i % 3;
      if (!(i >= 0 && i < 9) || b[r][c]) return null;
      b[r][c] = who;
      return b;
    },
    winner(b) {
      const at = (i) => b[Math.floor(i / 3)][i % 3];
      for (const [a, x, y] of rows) if (at(a) && at(a) === at(x) && at(a) === at(y)) return at(a);
      return b.flat().every(Boolean) ? "draw" : null;
    },
  });
})();
</script>
