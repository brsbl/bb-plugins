<!-- Pocket synth, built only from Playgrounds kit components (layers 0–3). The page
     declares its controls in markup; the script below is just the sound. -->
<style>:root { --pg-accent: #ea6a1f; }</style>

<h2 class="pg-title pg-reveal">Pocket synth</h2>
<p class="pg-subtitle pg-reveal">Two oscillators, a resonant filter and drive. Play it, or ask the agent to.</p>

<div data-pg="presets" class="pg-reveal" style="--i:1; margin-top:14px"><script type="application/json">{
  "Square lead": { "waveA": "square", "waveB": "sawtooth", "detune": 10, "mix": 0.35, "cutoff": 1500, "res": 4, "env": 0.4, "drive": 0.45, "a": 0.003, "d": 0.25, "s": 0.55, "r": 0.12, "rate": 5.5, "depth": 0.06, "lfo": "pitch", "delay": 0.22, "verb": 0.25 },
  "Riser": { "waveA": "sawtooth", "waveB": "sawtooth", "detune": 30, "mix": 0.5, "cutoff": 300, "res": 2, "env": 0.2, "drive": 0.3, "a": 0.35, "d": 1, "s": 0.9, "r": 0.7, "rate": 2, "depth": 0, "lfo": "filter", "delay": 0.3, "verb": 0.45 },
  "Big lead": { "waveA": "sawtooth", "waveB": "square", "detune": 18, "mix": 0.45, "cutoff": 3200, "res": 5, "env": 0.55, "drive": 0.75, "a": 0.003, "d": 0.3, "s": 0.6, "r": 0.14, "rate": 6, "depth": 0.08, "lfo": "pitch", "delay": 0.28, "verb": 0.3 },
  "Cross bass": { "waveA": "sawtooth", "waveB": "square", "detune": 8, "mix": 0.35, "cutoff": 190, "res": 9, "env": 0.7, "drive": 0.85, "a": 0.002, "d": 0.16, "s": 0.25, "r": 0.08, "rate": 4, "depth": 0, "lfo": "pitch", "delay": 0.05, "verb": 0.03 }
}</script></div>

<div class="pg-surface pg-reveal" style="--i:2; margin-top:12px">
  <div data-pg="scope" id="scope"><span class="pg-label">Output</span><output></output></div>
  <div class="pg-banks" style="--cols: 1fr 1.25fr">
    <section class="pg-group"><h4 class="pg-label">Oscillators</h4><div class="pg-bank">
      <div data-pg="picker" data-param="waveA" data-label="Oscillator A wave" data-caption="A" data-options="sine,triangle,sawtooth,square" data-value="square"></div>
      <div data-pg="picker" data-param="waveB" data-label="Oscillator B wave" data-caption="B" data-options="sine,triangle,sawtooth,square" data-value="sawtooth"></div>
      <div data-pg="dial" data-param="detune" data-label="Detune" data-min="0" data-max="50" data-step="1" data-unit="¢" data-value="10"></div>
    </div></section>
    <section class="pg-group"><h4 class="pg-label">Filter</h4><div class="pg-bank">
      <div data-pg="dial" data-param="cutoff" data-label="Cutoff" data-min="60" data-max="14000" data-scale="log" data-unit="Hz" data-value="1500"></div>
      <div data-pg="dial" data-param="res" data-label="Reso" data-min="0.5" data-max="18" data-step="0.1" data-value="4"></div>
      <div data-pg="dial" data-param="env" data-label="Env" data-unit="%" data-value="0.4"></div>
      <div data-pg="dial" data-param="drive" data-label="Drive" data-unit="%" data-value="0.45"></div>
    </div></section>
  </div>
  <div class="pg-banks" style="--cols: 1.35fr .7fr .7fr">
    <section class="pg-group"><h4 class="pg-label">Envelope</h4><div class="pg-bank">
      <div data-pg="dial" data-param="a" data-label="Attack" data-min="0.002" data-max="2" data-scale="log" data-unit="s" data-value="0.003"></div>
      <div data-pg="dial" data-param="d" data-label="Decay" data-min="0.02" data-max="2.5" data-scale="log" data-unit="s" data-value="0.25"></div>
      <div data-pg="dial" data-param="s" data-label="Sustain" data-unit="%" data-value="0.55"></div>
      <div data-pg="dial" data-param="r" data-label="Release" data-min="0.02" data-max="3" data-scale="log" data-unit="s" data-value="0.12"></div>
    </div></section>
    <section class="pg-group"><h4 class="pg-label">Wobble</h4><div class="pg-bank">
      <div data-pg="dial" data-param="rate" data-label="Rate" data-min="0.05" data-max="12" data-scale="log" data-unit="Hz" data-value="5.5"></div>
      <div data-pg="dial" data-param="depth" data-label="Depth" data-unit="%" data-value="0.06"></div>
    </div></section>
    <section class="pg-group"><h4 class="pg-label">Space</h4><div class="pg-bank">
      <div data-pg="dial" data-param="delay" data-label="Echo" data-max="0.8" data-unit="%" data-value="0.22"></div>
      <div data-pg="dial" data-param="verb" data-label="Room" data-unit="%" data-value="0.25"></div>
    </div></section>
  </div>
</div>

<div data-pg="keyboard" class="pg-reveal" style="--i:3; margin-top:12px" data-from="60" data-count="25"></div>

<div class="pg-transport pg-reveal" style="--i:4; margin-top:12px">
  <div><button data-pg="record" type="button"></button><button data-pg="send" data-label="Pocket synth take" type="button"></button></div>
  <span class="pg-hint">Play: <b>A–K</b> · <b>Z/X</b> octave · Record a phrase to send it to the agent</span>
  <div><button data-pg="toggle" data-param="hold" type="button">Hold</button><button data-pg="toggle" data-param="arp" type="button">Arpeggiate</button></div>
</div>

<script>
(() => {
  const pg = window.playground, P = pg.params, ui = pg.ui;
  // Settings that presets change but nobody turns by hand.
  P.define("mix", { min: 0, max: 1, default: 0.35 });
  P.define("lfo", { options: [{ value: "pitch", label: "Pitch" }, { value: "filter", label: "Filter" }], default: "pitch" });
  const v = (k) => P.get(k);

  let ac = null, bus, analyser, delaySend, delayFb, verbSend, lfo, lfoPitch, lfoFilter;
  function graph() {
    if (bus) return true;
    ac = ui.audio();
    if (!ac || ac.state !== "running") return false;
    bus = ac.createGain(); bus.gain.value = .5;
    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -12; comp.ratio.value = 5; comp.attack.value = .003; comp.release.value = .12;
    analyser = ac.createAnalyser(); analyser.fftSize = 2048; bus.connect(comp);
    const delay = ac.createDelay(1.5); delay.delayTime.value = .375;
    delaySend = ac.createGain(); delayFb = ac.createGain(); const tone = ac.createBiquadFilter(); tone.type = "lowpass"; tone.frequency.value = 2400;
    bus.connect(delaySend).connect(delay).connect(tone).connect(delayFb).connect(delay); tone.connect(comp);
    const conv = ac.createConvolver(), len = ac.sampleRate * 2.4, ir = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.4); }
    conv.buffer = ir; verbSend = ac.createGain(); bus.connect(verbSend).connect(conv).connect(comp);
    const out = ac.createGain(); out.gain.value = .8; comp.connect(out).connect(analyser).connect(ac.destination);
    lfo = ac.createOscillator(); lfoPitch = ac.createGain(); lfoFilter = ac.createGain(); lfo.connect(lfoPitch); lfo.connect(lfoFilter); lfo.start();
    ui.scope(document.getElementById("scope")).attach(analyser);
    globals();
    return true;
  }
  const curves = {};
  const curve = (drive) => { const k = Math.round(drive * 40) / 40; if (curves[k]) return curves[k]; const n = 1024, c = new Float32Array(n), a = 1 + k * 60; for (let i = 0; i < n; i++) { const x = i / (n - 1) * 2 - 1; c[i] = (1 + a) * x / (1 + a * Math.abs(x)) / (1 + k * .6); } return (curves[k] = c); };
  const live = new Set();
  function globals() {
    if (!bus) return;
    const t = ac.currentTime;
    delaySend.gain.setTargetAtTime(v("delay"), t, .04); delayFb.gain.setTargetAtTime(v("delay") * .7, t, .04);
    verbSend.gain.setTargetAtTime(v("verb") * .9, t, .04);
    lfo.frequency.setTargetAtTime(v("rate"), t, .04);
    lfoPitch.gain.setTargetAtTime(v("lfo") === "pitch" ? v("depth") * 40 : 0, t, .04);
    lfoFilter.gain.setTargetAtTime(v("lfo") === "filter" ? v("depth") * 2600 : 0, t, .04);
    for (const x of live) { if (x.released) continue; x.o2.detune.setTargetAtTime(v("detune"), t, .03); x.f.Q.setTargetAtTime(v("res"), t, .03); x.f.frequency.setTargetAtTime(Math.min(18000, v("cutoff") * (1 + v("env") * 3 * v("s"))), t, .06); x.sh.curve = curve(v("drive")); }
  }
  function voice(m) {
    const t = ac.currentTime + .005, f = 440 * Math.pow(2, (m - 69) / 12);
    const o1 = ac.createOscillator(), o2 = ac.createOscillator(), g1 = ac.createGain(), g2 = ac.createGain(), fl = ac.createBiquadFilter(), sh = ac.createWaveShaper(), amp = ac.createGain();
    o1.type = v("waveA"); o2.type = v("waveB"); o1.frequency.value = f; o2.frequency.value = f; o2.detune.value = v("detune");
    g1.gain.value = 1 - v("mix"); g2.gain.value = v("mix"); fl.type = "lowpass"; fl.Q.value = v("res"); sh.curve = curve(v("drive")); sh.oversample = "2x";
    lfoPitch.connect(o1.detune); lfoPitch.connect(o2.detune); lfoFilter.connect(fl.detune);
    const peak = Math.min(18000, v("cutoff") * Math.pow(2, v("env") * 5)), sus = Math.min(18000, v("cutoff") * (1 + v("env") * 3 * v("s")));
    fl.frequency.setValueAtTime(v("cutoff"), t); fl.frequency.exponentialRampToValueAtTime(peak, t + v("a") + .004); fl.frequency.setTargetAtTime(sus, t + v("a"), v("d") / 3);
    amp.gain.setValueAtTime(0, t); amp.gain.linearRampToValueAtTime(.3, t + v("a")); amp.gain.setTargetAtTime(.3 * v("s"), t + v("a"), v("d") / 3);
    o1.connect(g1).connect(fl); o2.connect(g2).connect(fl); fl.connect(sh).connect(amp).connect(bus);
    o1.start(t); o2.start(t);
    const x = { o1, o2, f: fl, sh, amp, released: false }; live.add(x); o1.onended = () => live.delete(x);
    return x;
  }
  function stop(x) {
    if (!x || x.released) return;
    x.released = true;
    const t = ac.currentTime, r = v("r");
    for (const prm of [x.amp.gain, x.f.frequency]) { const c = prm.value; prm.cancelScheduledValues(t); prm.setValueAtTime(c, t); }
    x.amp.gain.setTargetAtTime(0, t, r / 4); x.o1.stop(t + r * 1.6 + .05); x.o2.stop(t + r * 1.6 + .05);
  }

  // Keys from the person or the agent arrive as the same press and release events.
  const held = new Map();
  let arpTimer = 0, arpI = 0;
  ui.on("press", ({ id }) => {
    if (typeof id !== "number" || held.has(id)) return;
    held.set(id, !v("arp") && graph() ? voice(id) : null);
    ui.scope(document.getElementById("scope")).readout(ui.noteName(id));
  });
  ui.on("release", ({ id }) => { if (v("hold") || !held.has(id)) return; stop(held.get(id)); held.delete(id); });
  P.on(({ name, value }) => {
    globals();
    if (name === "hold" && !value) for (const [m, x] of held) { stop(x); held.delete(m); }
    if (name === "arp") {
      clearInterval(arpTimer);
      if (value) arpTimer = setInterval(() => {
        const notes = [...held.keys()].sort((p, q) => p - q);
        if (!notes.length || !graph()) return;
        const span = [...notes, ...notes.map((n) => n + 12)], x = voice(span[arpI++ % span.length]);
        setTimeout(() => stop(x), 110);
      }, 125);
    }
  });
  P.define("hold", { type: "toggle", default: false });
  P.define("arp", { type: "toggle", default: false });
})();
</script>
