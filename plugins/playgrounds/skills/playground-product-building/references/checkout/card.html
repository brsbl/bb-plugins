<style>
  .screen h3 { margin: 0; font-size: 15px; font-weight: 500; letter-spacing: -.01em; color: var(--pg-ink); }
  .screen p { margin: 4px 0 0; font-size: 12px; color: var(--pg-body); }
  .line { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--pg-hairline); font-size: 12px; color: var(--pg-ink); font-variant-numeric: tabular-nums; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .graph { padding: 2px 14px 10px; }
  .shot { padding: 0 14px; }
</style>

<header class="pg-reveal" style="--i:0">
  <h2 class="pg-title">Checkout, one event at a time</h2>
  <p class="pg-subtitle">The first payment was declined. Retry it, then make the gateway time out.</p>
</header>

<figure class="pg-fig pg-reveal" style="--i:1">
  <figcaption class="pg-fig-head"><span><b>Fig. 1</b> Order 1042</span><span id="live" class="pg-badge"></span></figcaption>
  <div class="graph"><svg id="graph" role="img" aria-label="Checkout states and transitions"></svg></div>
  <div class="shot">
    <div class="pg-window">
      <div class="pg-window-bar"><strong>shop.example</strong><span>/ checkout</span></div>
      <div class="pg-window-body screen" id="screen" aria-live="polite"></div>
    </div>
  </div>
  <div class="pg-fig-foot"><span>Payment key <span id="key"></span> · reused on retry</span><output id="clock"></output></div>
</figure>

<dl class="pg-readouts pg-reveal" style="--i:2">
  <div data-answer id="answer"><dt>Customer charged</dt><dd id="charged"></dd></div>
  <div><dt>Payment attempts</dt><dd id="attempts"></dd></div>
</dl>

<div class="pg-controls pg-reveal" style="--i:3">
  <div class="pg-row"><span>Gateway responds</span><div class="pg-seg" id="gateway" role="group" aria-label="Gateway response"></div></div>
</div>
