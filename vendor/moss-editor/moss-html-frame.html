<!doctype html><meta charset="utf-8"><script>
addEventListener('message', function onContent(event) {
  if (event.source !== parent || !event.data || event.data.type !== 'moss-html-frame-content') return;
  removeEventListener('message', onContent);
  document.open();
  document.write(String(event.data.html));
  document.close();
});
parent.postMessage({ type: 'moss-html-frame-ready' }, '*');
</script>
