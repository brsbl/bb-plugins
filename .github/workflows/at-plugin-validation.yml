name: At Plugin validation
on:
  workflow_dispatch:
jobs:
  at-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace=bb-plugin-at-plugin
      - run: npm test --workspace=bb-plugin-at-plugin
      - run: npm run build --workspace=bb-plugin-at-plugin
      - uses: actions/upload-artifact@v4
        with:
          name: at-plugin-dist
          path: plugins/at-plugin/dist
