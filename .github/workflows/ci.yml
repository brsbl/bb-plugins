name: FPL Draft recovery verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fpl-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: npm run check --workspace=bb-plugin-fpl-draft
      - uses: actions/upload-artifact@v4
        with:
          name: fpl-draft-recovery
          path: |
            plugins/fpl-draft/dist/
            plugins/fpl-draft/assets/
            plugins/fpl-draft/package.json
          retention-days: 7
